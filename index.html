<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SADAJIWA - Orientasi oleh Magnus Edmund</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Chakra+Petch:ital,wght@0,600;0,700;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #060911;
      --panel-bg: rgba(12, 18, 32, 0.94);
      --accent-blue: #38bdf8;
      --accent-navy: #1e3a8a;
      --accent-gold: #f59e0b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Space Grotesk', sans-serif;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .font-display {
      font-family: 'Chakra Petch', sans-serif;
    }

    .stage-bg {
      background: 
        radial-gradient(circle at 50% 35%, rgba(30, 58, 138, 0.35) 0%, rgba(6, 9, 17, 0.98) 70%),
        linear-gradient(180deg, #070b14 0%, #0d1526 55%, #05070d 100%);
      position: relative;
    }

    .grid-floor {
      position: absolute;
      bottom: 0;
      left: -20%;
      width: 140%;
      height: 36%;
      background-image: 
        linear-gradient(to right, rgba(56, 189, 248, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
      background-size: 36px 24px;
      transform: perspective(320px) rotateX(62deg);
      transform-origin: bottom;
      pointer-events: none;
    }

    @keyframes idleBreath {
      0%, 100% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(-4px) scaleY(1.012); }
    }

    @keyframes talkBounce {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-3px) rotate(-0.8deg); }
      75% { transform: translateY(-2px) rotate(0.8deg); }
    }

    @keyframes hairSway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(2.5deg); }
    }

    .chibi-idle {
      animation: idleBreath 3.2s ease-in-out infinite;
      transform-origin: bottom center;
    }

    .chibi-talking {
      animation: talkBounce 0.34s ease-in-out infinite;
      transform-origin: bottom center;
    }

    .ahoge-sway {
      animation: hairSway 2.6s ease-in-out infinite;
      transform-origin: 150px 58px;
    }

    .dialogue-box {
      background: var(--panel-bg);
      border: 1.5px solid rgba(56, 189, 248, 0.32);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
    }

    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 99px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.45);
      border-radius: 99px;
    }

    .cursor-blink {
      display: inline-block;
      width: 7px;
      height: 15px;
      background-color: var(--accent-blue);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .wave-bar {
      width: 3px;
      height: 4px;
      background: var(--accent-gold);
      border-radius: 2px;
      transition: height 0.1s ease;
    }
    .speaking .wave-bar:nth-child(1) { animation: wave 0.5s infinite ease-in-out 0.0s; }
    .speaking .wave-bar:nth-child(2) { animation: wave 0.5s infinite ease-in-out 0.15s; }
    .speaking .wave-bar:nth-child(3) { animation: wave 0.5s infinite ease-in-out 0.3s; }
    .speaking .wave-bar:nth-child(4) { animation: wave 0.5s infinite ease-in-out 0.1s; }
    .speaking .wave-bar:nth-child(5) { animation: wave 0.5s infinite ease-in-out 0.25s; }

    @keyframes wave {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }

    .btn-action {
      transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .btn-action:active {
      transform: scale(0.95);
    }

    .rank-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.72), rgba(15, 23, 42, 0.9));
      border-left: 3px solid var(--accent-blue);
    }
  </style>
</head>

    let currentSlide = 0;

    let currentPlaybackId = 0;

    function setStatus(type, msg) {
      const dot = document.getElementById("statusDot");
      const text = document.getElementById("statusText");
      if (!dot || !text) return;
      text.textContent = msg;
      dot.className = "w-2 h-2 rounded-full shrink-0 " + (
        type === "ok" ? "bg-emerald-400" :
        type === "loading" ? "bg-sky-400 animate-ping" :
        "bg-amber-400"
      );
    }

    function setExpression(expr) {
      const eyesNormal = document.getElementById("eyesNormal");
      const eyesSharp = document.getElementById("eyesSharp");
      const eyesClosed = document.getElementById("eyesClosed");
      const browsNormal = document.getElementById("browsNormal");
      const browsStern = document.getElementById("browsStern");

      eyesNormal.style.display = "none";
      eyesSharp.style.display = "none";
      eyesClosed.style.display = "none";
      browsNormal.style.display = "none";
      browsStern.style.display = "none";

      if (expr === "sharp") {
        eyesSharp.style.display = "block";
        browsStern.style.display = "block";
      } else if (expr === "closed") {
        eyesClosed.style.display = "block";
        browsNormal.style.display = "block";
      } else {
        eyesNormal.style.display = "block";
        browsNormal.style.display = "block";
      }
      setMouth(expr === "smirk" ? "smirk" : "closed");
    }

    function setMouth(state) {
      document.getElementById("mouthClosed").style.display = state === "closed" ? "block" : "none";
      document.getElementById("mouthSmirk").style.display = state === "smirk" ? "block" : "none";
      document.getElementById("mouthOpen").style.display = state === "open" ? "block" : "none";
    }

    function startTalkingAnimation() {
      const wrapper = document.getElementById("chibiWrapper");
      const wave = document.getElementById("audioWave");
      wrapper.classList.remove("chibi-idle");
      wrapper.classList.add("chibi-talking");
      wave.classList.add("speaking");

      if (mouthTimer) clearInterval(mouthTimer);
      let toggle = false;
      mouthTimer = setInterval(() => {
        toggle = !toggle;
        setMouth(toggle ? "open" : "closed");
      }, 145);
    }

    function stopTalkingAnimation() {
      const wrapper = document.getElementById("chibiWrapper");
      const wave = document.getElementById("audioWave");
      wrapper.classList.remove("chibi-talking");
      wrapper.classList.add("chibi-idle");
      wave.classList.remove("speaking");

      if (mouthTimer) {
        clearInterval(mouthTimer);
        mouthTimer = null;
      }
      const expr = slides[currentSlide].expression;
      setMouth(expr === "smirk" ? "smirk" : "closed");
    }

    function stopAllAudio() {
      currentPlaybackId++;
      if (activeAudio) {
        try {
          activeAudio.pause();
          activeAudio.currentTime = 0;
        } catch (e) {}
        activeAudio = null;
      }
      if ("speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
      }
      stopTalkingAnimation();
    }

    async function fetchFishAudioFromNetlify(text) {
      const response = await fetch("/.netlify/functions/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          text: text,
          referenceId: FISH_MODEL_ID
        })
      });

      if (!response.ok) {
        throw new Error("Server TTS gagal: " + response.status);
      }
      const data = await response.json();
      if (!data.audioBase64) throw new Error("Data audio kosong");
      return "data:audio/mp3;base64," + data.audioBase64;
    }

    function playAudioElement(url, playId) {
      return new Promise((resolve, reject) => {
        if (playId !== currentPlaybackId) return reject("cancelled");
        const audio = new Audio(url);
        activeAudio = audio;

        audio.onplay = () => {
          if (playId === currentPlaybackId) startTalkingAnimation();
        };
        audio.onended = () => {
          if (playId === currentPlaybackId) stopTalkingAnimation();
          resolve();
        };
        audio.onerror = () => {
          if (playId === currentPlaybackId) stopTalkingAnimation();
          reject("Audio playback error");
        };

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch((err) => reject(err));
        }
      });
    }

    function playBrowserTTS(text, playId) {
      if (!("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "id-ID";
        utter.rate = 1.0;
        utter.pitch = 0.85;

        const voices = window.speechSynthesis.getVoices();
        const idMale = voices.find(v => v.lang.includes("id") && /male|ardhi|pria|damayanti/i.test(v.name))
                    || voices.find(v => v.lang.includes("id"));
        if (idMale) utter.voice = idMale;

        utter.onstart = () => {
          if (playId === currentPlaybackId) {
            startTalkingAnimation();
            setStatus("ok", "Memutar suara cadangan perangkat");
          }
        };
        utter.onend = () => {
          if (playId === currentPlaybackId) stopTalkingAnimation();
        };
        utter.onerror = () => {
          if (playId === currentPlaybackId) stopTalkingAnimation();
        };

        window.speechSynthesis.speak(utter);
      } catch (e) {
        stopTalkingAnimation();
      }
    }

    async function speakSlide(index) {
      stopAllAudio();
      if (isMuted) {
        setStatus("warn", "Suara dalam mode Mute");
        return;
      }

      const playId = currentPlaybackId;
      const slide = slides[index];

      if (audioCache[index]) {
        try {
          setStatus("ok", "Memutar suara Magnus Edmund");
          await playAudioElement(audioCache[index], playId);
          return;
        } catch (e) {}
      }

      setStatus("loading", "Memuat suara Magnus Edmund...");
      try {
        const audioDataUrl = await fetchFishAudioFromNetlify(slide.speechText);
        if (playId !== currentPlaybackId) return;
        audioCache[index] = audioDataUrl;
        setStatus("ok", "Memutar suara Magnus Edmund");
        await playAudioElement(audioDataUrl, playId);
        return;
      } catch (err) {
        if (playId !== currentPlaybackId) return;
        setStatus("warn", "Memakai suara cadangan perangkat...");
      }

      if (playId === currentPlaybackId) {
        playBrowserTTS(slide.speechText, playId);
      }
    }

      const scrollBox = document.getElementById("dialogueScroll");
      scrollBox.scrollTop = 0;

      if (typeTimer) clearInterval(typeTimer);

      const fullHTML = buildSlideHTML(slide);
      if (slide.layout !== "text") {
        container.innerHTML = fullHTML;
        isTyping = false;
      } else {
        isTyping = true;
        const combinedText = slide.paragraphs.join("\n\n");
        let charIdx = 0;
        container.innerHTML = `<span class="cursor-blink"></span>`;

        typeTimer = setInterval(() => {
          charIdx += 3;
          if (charIdx >= combinedText.length) {
            clearInterval(typeTimer);
            isTyping = false;
            container.innerHTML = fullHTML;
          } else {
            const slice = combinedText.slice(0, charIdx)
              .split("\n\n")
              .map(p => `<p>${p}</p>`)
              .join("");
            container.innerHTML = slice + `<span class="cursor-blink"></span>`;
            scrollBox.scrollTop = scrollBox.scrollHeight;
          }
        }, 16);
      }

      if (autoAudio) {
        speakSlide(index);
      }
    }

    function skipTypewriter() {
      if (isTyping) {
        clearInterval(typeTimer);
        isTyping = false;
        document.getElementById("dialogueContent").innerHTML = buildSlideHTML(slides[currentSlide]);
      }
    }

    function handleStageClick() {
      if (isTyping) {
        skipTypewriter();
      } else {
        speakSlide(currentSlide);
      }
    }

    function nextSlide() {
      if (isTyping) {
        skipTypewriter();
        return;
      }
      if (currentSlide < slides.length - 1) {
        renderSlide(currentSlide + 1, true);
      } else {
        renderSlide(0, true);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        renderSlide(currentSlide - 1, true);
      }
    }

    function replayCurrentAudio() {
      speakSlide(currentSlide);
    }

    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById("muteIcon").textContent = isMuted ? "🔇" : "🔊";
      if (isMuted) {
        stopAllAudio();
        setStatus("warn", "Suara dimatikan (Mute)");
      } else {
        speakSlide(currentSlide);
      }
    }

    function renderProgressDots() {
      const container = document.getElementById("progressDots");
      container.innerHTML = slides.map((_, idx) => `
        <button onclick="renderSlide(${idx}, true)" class="h-2 rounded-full transition-all ${idx === currentSlide ? 'w-6 bg-sky-400' : 'w-2 bg-slate-700 hover:bg-slate-500'}"></button>
      `).join("");
    }

    function toggleChapterMenu() {
      const modal = document.getElementById("chapterModal");
      const list = document.getElementById("chapterList");
      if (modal.classList.contains("hidden")) {
        list.innerHTML = slides.map((s, idx) => `
          <button onclick="renderSlide(${idx}, true); toggleChapterMenu();" class="w-full text-left px-3.5 py-2.5 rounded-xl border transition flex items-center justify-between ${idx === currentSlide ? 'bg-sky-500/20 border-sky-400 text-white' : 'bg-slate-950/70 border-slate-800 text-slate-300 hover:border-slate-600'}">
            <div>
              <div class="text-[10px] font-display text-sky-400">SLIDE ${idx + 1}</div>
              <div class="text-xs font-semibold">${s.chapter}</div>
            </div>
            <span class="text-xs text-slate-500">→</span>
          </button>
        `).join("");
        modal.classList.remove("hidden");
      } else {
        modal.classList.add("hidden");
      }
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderSlide(0, false);
    });
  </script>
</body>
</html>
